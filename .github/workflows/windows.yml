# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
name: Build Windows Develop
on:
  push:
    branches:
    - 'master'
    - 'mackan'
    
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.3'
        cache: false
    - name: Install dependencies
      run: |
        go get .
        go install fyne.io/tools/cmd/fyne@latest
        .\setup_build_env.ps1
    - name: Build
      run: |
        $env:CGO_ENABLED = "1"
        $env:CC = "x86_64-w64-mingw32-clang.exe"
        $env:CXX = "x86_64-w64-mingw32-clang++.exe"
        $env:PATH += ";D:\a\hcd\hcd\llvm-mingw\bin"
        $env:GOOS = "windows"
        $env:GOARCH = "386"
        fyne package --release
    - name: Create Setup
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" .\setup\setup.nsi
    - name: Create Zip
      run: 7z a lightcontrol.zip LightControl.exe
    - name: Create Setup Zip
      run: 7z a lightcontrol-setup.zip lightcontrol_setup.exe
    - name: Delete previous nightly release
      run: |
        gh release view nightly 2>$null
        if ($LASTEXITCODE -eq 0) {
          gh release delete nightly --yes --cleanup-tag
        } else {
          Write-Host "No existing nightly release to delete."
          $global:LASTEXITCODE = 0
        }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish nightly release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly Build
        body: Automated build from `${{ github.ref_name }}` at ${{ github.sha }}.
        prerelease: true
        make_latest: false
        target_commitish: ${{ github.sha }}
        files: lightcontrol.zip