name: Build Windows Release
on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive
    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'
    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26.3'
        cache: false
    - name: Install dependencies
      run: |
        go get .
        go install fyne.io/tools/cmd/fyne@latest
        .\setup_build_env.ps1
    - name: Build
      run: |
        $env:CGO_ENABLED = "1"
        $env:CC = "x86_64-w64-mingw32-clang.exe"
        $env:CXX = "x86_64-w64-mingw32-clang++.exe"
        $env:PATH += ";D:\a\hcd\hcd\llvm-mingw\bin"
        $env:GOOS = "windows"
        $env:GOARCH = "386"
        fyne package -tags j2534 --release
    - name: Create Setup
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" .\setup\setup.nsi
    - name: Creating Zip
      run: 7z a lightcontrol.zip LightControl.exe
    - name: Create Setup Zip
      run: 7z a lightcontrol-setup.zip lightcontrol_setup.exe
    - name: Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_REPOSITORY: roffe/hcd
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        make_latest: "true"
        files: |
          lightcontrol.zip
          lightcontrol-setup.zip

